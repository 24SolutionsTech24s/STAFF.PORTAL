<style>
:root{--navy:#0a192f;--navy2:#0b1f4d;--b900:#0b2a6f;--b700:#1d4ed8;--b600:#2563eb;--b500:#3b82f6;--b400:#60a5fa;--b100:#dbeafe;--b50:#eff6ff;
--bg:#eef0f3;--card:#fff;--ink:#0b1f3a;--mute:#64748b;--line:#e2e8f0;--ok:#00b36b;--warn:#f59e0b;--bad:#ef4444;--nav-h:68px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{font-family:'Inter',system-ui,sans-serif;background:var(--bg);color:var(--ink);padding-top:env(safe-area-inset-top,0px)}
button{font-family:inherit;cursor:pointer;border:0}
.hidden{display:none!important}
.ic{width:1.15em;height:1.15em;vertical-align:-.2em;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.lbl{font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:var(--mute)}
/* status pill (same as Help Centre) */
.pill{display:inline-flex;align-items:center;gap:.4rem;font-size:9px;font-weight:900;letter-spacing:.14em;text-transform:uppercase;padding:.35rem .7rem;border-radius:999px;background:rgba(0,0,0,.35);border:1px solid rgba(255,255,255,.12);color:#ffb020}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill[data-mode=live]{color:#00ff88}.pill[data-mode=live]::before{animation:pulse 1.6s infinite}
.pill[data-mode=offline],.pill[data-mode=error]{color:#ff8080}
@keyframes pulse{50%{opacity:.25;transform:scale(1.5)}}
/* login */
#login{position:fixed;inset:0;z-index:50;display:flex;align-items:center;justify-content:center;padding:1.25rem;overflow:auto;

.lgart .dash path{stroke-dasharray:3 7;animation:ddash 14s linear infinite}
.lgart .pulse circle{animation:dpulse 3s ease-in-out infinite}.lgart .pulse circle:nth-child(even){animation-delay:1.5s}
.lgart .float{animation:dflt 4s ease-in-out infinite}.lgart .f2{animation-delay:1.3s}.lgart .f3{animation-delay:2.4s}
.lgart .cursor{animation:dcur 6s ease-in-out infinite}
@media(max-width:700px){#login .lgart{opacity:.5}}
@keyframes dspin{to{transform:translate(-50%,-50%) rotate(360deg)}}
@keyframes ddash{to{stroke-dashoffset:-200}}
@keyframes dpulse{50%{opacity:.25}}
@keyframes dflt{50%{transform:translateY(-6px)}}
@keyframes dcur{0%,100%{transform:translate(300px,270px)}50%{transform:translate(380px,320px)}}</style><style>.lg-card{position:relative;z-index:2}</style></head>

const PCOL={Critical:'#ef4444',High:'#f59e0b',Medium:'#3b82f6',Low:'#94a3b8'};

const fb={ready:false,auth:null,db:null};
const S={user:null,tab:'home',jobs:new Map(),jobTab:'mine',gens:[],sites:[],kb:[],q:'',kbType:'all',radarTab:'gens',shifts:[],here:null,unsubs:[],
  shift:{active:false,id:null,start:0,dist:0,pts:0,last:null,fix:null,watch:null,tick:null,wake:null,acc:null,batt:null}};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const FV=()=>firebase.firestore.FieldValue;
const I=p=>`<svg class="ic" viewBox="0 0 24 24">${p}</svg>`;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600)}
function pill(label,mode){document.querySelectorAll('.pill').forEach(p=>{p.textContent=label;p.dataset.mode=mode})}

/* ---------- boot ---------- */
(function init(){
  try{
    firebase.initializeApp(FIREBASE_CONFIG);fb.auth=firebase.auth();fb.db=firebase.firestore();
    fb.db.enablePersistence({synchronizeTabs:true}).catch(()=>{});   // offline cache: jobs & KB work without signal
    fb.ready=true;pill(navigator.onLine?'':'Offline • Cached','live');
    if(!navigator.onLine)pill('Offline • Cached','offline');
    fb.auth.onAuthStateChanged(u=>{if(u&&!S.user)boot(u)});
  }catch(e){pill('Local Mode • Not Synced','local')}
  addEventListener('online',()=>{pill('','live');flushQ()});addEventListener('offline',()=>pill('Offline • Cached','offline'));
  $('pw').addEventListener('keydown',e=>{if(e.key==='Enter')signIn()});
})();

async function signIn(){
  const e=$('em').value.trim(),p=$('pw').value,er=$('lgErr');er.classList.add('hidden');
  if(!fb.ready||!e||!p){er.textContent=fb.ready?'Enter email and password':'Firebase unavailable';er.classList.remove('hidden');return}
  try{await fb.auth.signInWithEmailAndPassword(e,p)}
  catch(x){er.textContent=(x.code||'Sign-in failed').replace('auth/','').replace(/-/g,' ');er.classList.remove('hidden')}
}
async function boot(u){
  let prof={};try{const s=await fb.db.collection(C.users).doc(u.uid).get();if(s.exists)prof=s.data()}catch(e){}
  if(prof.deregistered){await fb.auth.signOut();const er=$('lgErr');er.textContent='Account deregistered — contact management';er.classList.remove('hidden');return}
  S.user={id:u.uid,name:prof.name||prof.displayName||u.email,title:prof.roleTitle||(prof.role==='management'?'Operations':'Technician'),role:prof.role||'technician'};
  enter();listen();setupAtt();watchPeers();initRTC();restoreShift();
}
function enter(){
  $('login').classList.add('hidden');$('app').classList.remove('hidden');
  $('hello').textContent=S.user.title;
  $('who').textContent=S.user.name.split(' ')[0];$('av').textContent=S.user.name.trim().split(/\s+/).map(w=>w[0]).slice(0,2).join('').toUpperCase();
  render();setInterval(()=>{if(S.tab==='home')tickHome()},1000);
  navigator.getBattery&&navigator.getBattery().then(b=>{const u=()=>S.shift.batt=Math.round(b.level*100);u();b.onlevelchange=u}).catch(()=>{});
  locate(false);
}
function signOut(){
  if(S.shift.active&&!confirm('You are still on shift. End shift and sign out?'))return;
  const go=()=>{S.unsubs.forEach(u=>u());attUnsubs.forEach(u=>u());rtcShutdown();fb.auth.signOut().then(()=>location.reload())};
  S.shift.active?endShift().then(go):go();
}

/* ---------- live listeners (same collections as Help Centre) ---------- */
function listen(){
  const d=fb.db,uid=S.user.id,add=(q,fn)=>S.unsubs.push(q.onSnapshot(fn,e=>console.warn(e.code)));
  const put=snap=>{snap.docChanges().forEach(c=>c.type==='removed'?S.jobs.delete(c.doc.id):S.jobs.set(c.doc.id,norm(c.doc)));render()};
  add(d.collection(C.jobs).where('techId','==',uid),put);
  add(d.collection(C.jobs).where('assignedTo','==',uid),put);
  add(d.collection(C.jobs).where('status','==','Open'),put);                 // open pool → claimable
  add(d.collection(C.generators),s=>{S.gens=s.docs.map(x=>({id:x.id,...x.data()}));if(S.tab==='radar')render()});
  d.collection(C.sites).get().then(s=>{S.sites=s.docs.map(x=>({id:x.id,...x.data()}));if(S.tab==='radar')render()}).catch(()=>{});
  Promise.all([C.knowledge,C.resources,C.training].map(c=>d.collection(c).get().then(s=>s.docs.map(x=>({_t:c,id:x.id,...x.data()}))).catch(()=>[]))).then(a=>{S.kb=a.flat();try{localStorage.setItem('24s.kb',JSON.stringify(S.kb))}catch(e){}if(S.tab==='help')render()});
  try{S.kb=JSON.parse(localStorage.getItem('24s.kb')||'[]')}catch(e){}
  loadShifts();
}
function norm(x){const d=x.data();return{docId:x.id,id:d.id||('#'+x.id.slice(0,6).toUpperCase()),title:d.title||d.issue||'Untitled job',site:d.site||d.siteName||'',loc:d.location||d.loc||'',tech:d.tech||d.assignedToName||'',techId:d.techId||d.assignedTo||'',
  priority:d.priority||'Medium',status:d.status||'Assigned',sla:d.sla||d.slaRemaining||'',slaPercent:d.slaPercent,notes:d.notes||'',lat:d.lat,lng:d.lng,createdAt:d.createdAt,completedAt:d.completedAt}}
const mine=j=>j.techId===S.user.id||(j.tech&&j.tech===S.user.name);
const ms=t=>t&&t.toMillis?t.toMillis():(t&&t.seconds?t.seconds*1000:0);

/* ---------- smart ranking: priority + SLA pressure + distance ---------- */
function km(a,b){const R=6371,r=Math.PI/180,dl=(b.lat-a.lat)*r,dn=(b.lng-a.lng)*r,x=Math.sin(dl/2)**2+Math.cos(a.lat*r)*Math.cos(b.lat*r)*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(x))}
function siteLL(j){if(j.lat&&j.lng)return{lat:+j.lat,lng:+j.lng};const s=S.sites.find(x=>(x.name||x.siteName||x.id)===j.site||x.id===j.site);return s&&(s.lat||s.latitude)?{lat:+(s.lat||s.latitude),lng:+(s.lng||s.lon||s.longitude)}:null}
function score(j){let s=PRI[j.priority]||15,why=[];const p=Number(j.slaPercent);if(Number.isFinite(p)){s+=(100-p)*.3;if(p<40)why.push(['SLA at risk','red'])}
  const ll=siteLL(j);if(ll&&S.here){const k=km(S.here,ll);j._km=k;s+=Math.max(0,20-k);why.push([k.toFixed(1)+' km','']);}
  if(j.status==='On Site'||j.status==='En Route')s+=25,why.unshift(['In progress','grn']);return{s,why}}
const active=()=>[...S.jobs.values()].filter(j=>mine(j)&&j.status!=='Completed').map(j=>({j,...score(j)})).sort((a,b)=>b.s-a.s);

/* ---------- navigation ---------- */
function go(t){S.tab=t;document.querySelectorAll('.nav').forEach(n=>n.classList.toggle('on',n.dataset.t===t));['home','jobs','conn','radar','help','me'].forEach(x=>$('t-'+x).classList.toggle('hidden',x!==t));render();scrollTo(0,0)}
function render(){const n=active().length,d=$('jobDot');d.textContent=n;d.classList.toggle('hidden',!n);({home:rHome,jobs:rJobs,conn:rConn,radar:rRadar,help:rHelp,me:rMe})[S.tab]()}

/* ---------- HOME ---------- */
function rHome0(){
  const a=active(),next=a[0],sh=S.shift,done=weekDone(),goal=10;
  $('t-home').innerHTML=`
  <div class="card hero">
    <div class="row sp"><span class="lbl">${sh.active?'On shift':'Off shift'}</span><span class="chip" style="background:rgba(255,255,255,.1);color:#fff;border-color:rgba(255,255,255,.2)">${sh.active?'GPS ±'+(sh.acc||'—')+'m':'Not tracking'}</span></div>
    <div class="timer" id="timer">${fmt(sh.active?Date.now()-sh.start:0)}</div>
    <div class="grid3" style="margin:.6rem 0 1rem"><div class="stat"><span class="lbl">Distance</span><b id="sDist">${(sh.dist/1000).toFixed(2)} km</b></div><div class="stat"><span class="lbl">Points</span><b>${sh.pts}</b></div><div class="stat"><span class="lbl">Battery</span><b>${sh.batt==null?'—':sh.batt+'%'}</b></div></div>
    <button class="btn ${sh.active?'red':''}" onclick="${sh.active?'confirmEnd()':'startShift()'}">${sh.active?'End shift':'Start shift'}</button>
  </div>
  <div class="quick">
    <button onclick="faultSheet()">${I('<path d="M12 9v4M12 17h.01"/><path d="M10.3 3.9L2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"/>')}Log fault</button>
    <button onclick="backup()" class="${next?'':'dis'}">${I('<path d="M12 2l9 4v6c0 5-4 9-9 10-5-1-9-5-9-10V6z"/><path d="M12 8v5M12 16h.01"/>')}Backup</button>
    <button onclick="go('help');setTimeout(()=>$('kq')&&$('kq').focus(),50)">${I('<circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/>')}Find fix</button>
    <button onclick="navTo((active()[0]||{}).j)">${I('<path d="M3 11l19-9-9 19-2-8z"/>')}Navigate</button>
  </div>
  <div class="lbl" style="margin:.4rem .3rem .6rem">Up next • smart ranked</div>
  ${next?jobCard(next.j,next.why,true):'<div class="card empty">No active jobs. Check the open pool in Jobs to claim work.</div>'}
  <div class="card row" style="gap:1.1rem">
    <div class="ring" style="--p:${Math.min(100,done/goal*100)}"><div>${done}<small>OF ${goal}</small></div></div>
    <div><div class="lbl">Weekly target</div><div style="font-weight:800;font-size:15px;margin:.3rem 0">${done>=goal?'Target smashed':'Keep going'}</div><div class="meta">Jobs completed this week.<br>${streak()}-day streak</div></div>
  </div>`;
}
function tickHome(){const s=S.shift;if(!s.active)return;const t=$('timer');if(t)t.textContent=fmt(Date.now()-s.start);const d=$('sDist');if(d)d.textContent=(s.dist/1000).toFixed(2)+' km'}
const fmt=ms=>{const s=Math.floor(ms/1000),p=n=>String(n).padStart(2,'0');return p(Math.floor(s/3600))+':'+p(Math.floor(s%3600/60))+':'+p(s%60)};
function doneJobs(){return[...S.jobs.values()].filter(j=>mine(j)&&j.status==='Completed')}
function weekDone(){const w=Date.now()-7*864e5;return[...S.jobs.values(),...(S.hist||[])].filter(j=>mine(j)&&j.status==='Completed'&&ms(j.completedAt)>w).length||S.doneN||0}
function streak(){const days=new Set([...S.shifts.map(x=>ms(x.startedAt)),...doneJobs().map(j=>ms(j.completedAt))].filter(Boolean).map(t=>new Date(t).toDateString()));let n=0,d=new Date();while(days.has(d.toDateString())){n++;d=new Date(d-864e5)}return n}

/* ---------- JOBS ---------- */
function jobCard(j,why,big){
  const si=STEPS.indexOf(j.status),p=Number(j.slaPercent),c=PCOL[j.priority]||PCOL.Medium;
  return`<div class="card job" style="--c:${c}" onclick="openJob('${j.docId}')">
    <div class="row sp"><span class="lbl">${esc(j.id)} • ${esc(j.priority)}</span><span class="chip ${j.status==='Completed'?'grn':''}">${esc(j.status)}</span></div>
    <h4>${esc(j.title)}</h4><div class="meta">${esc(j.site||'No site')}${j.loc?' • '+esc(j.loc):''}${j.sla?' • SLA '+esc(j.sla):''}</div>
    ${si>=0?`<div class="steps">${STEPS.map((_,i)=>`<i class="${i<=si?'d':''}"></i>`).join('')}</div>`:''}
    ${Number.isFinite(p)?`<div class="bar"><i style="width:${Math.max(3,Math.min(100,p))}%;${p<40?'background:linear-gradient(90deg,#ef4444,#f59e0b)':''}"></i></div>`:''}
    ${why&&why.length?`<div class="row wrapx" style="margin-top:.7rem;gap:.4rem">${why.map(w=>`<span class="chip ${w[1]}">${esc(w[0])}</span>`).join('')}</div>`:''}</div>`}
function rJobs(){
  const all=[...S.jobs.values()],pool=all.filter(j=>!j.techId&&!j.tech&&j.status==='Open'),done=doneJobs();
  const list=S.jobTab==='mine'?active().map(x=>jobCard(x.j,x.why)):S.jobTab==='pool'?pool.map(j=>jobCard(j)):done.map(j=>jobCard(j));
  $('t-jobs').innerHTML=`<div class="seg">${[['mine','Mine ('+active().length+')'],['pool','Open pool ('+pool.length+')'],['done','Done']].map(t=>`<button class="${S.jobTab===t[0]?'on':''}" onclick="S.jobTab='${t[0]}';rJobs()">${t[1]}</button>`).join('')}</div>
  ${list.join('')||'<div class="card empty">Nothing here yet.</div>'}
  <button class="btn ghost" onclick="faultSheet()">+ Log a new fault</button>`;
}
function openJob(id){
  const j=S.jobs.get(id);if(!j)return;const nxt=STEPS[STEPS.indexOf(j.status)+1],claim=!j.techId&&!j.tech;
  sheet(`<div class="row sp"><span class="lbl">${esc(j.id)} • ${esc(j.priority)}</span><span class="chip">${esc(j.status)}</span></div>
  <h3 style="margin:.4rem 0;font-size:19px;font-weight:900">${esc(j.title)}</h3><div class="meta">${esc(j.site)} ${j.loc?'• '+esc(j.loc):''} ${j.sla?'• SLA '+esc(j.sla):''}</div>
  <div class="steps">${STEPS.map((_,i)=>`<i class="${i<=STEPS.indexOf(j.status)?'d':''}"></i>`).join('')}</div>
  <div class="row" style="gap:.6rem">${claim?`<button class="btn" onclick="claim('${id}')">Claim this job</button>`:nxt?`<button class="btn" onclick="advance('${id}')">Mark: ${nxt}</button>`:''}<button class="btn ghost sm" onclick="navTo(S.jobs.get('${id}'))">${I('<path d="M3 11l19-9-9 19-2-8z"/>')}Go</button></div>
  ${j.status!=='Completed'&&!claim&&j.status!=='Awaiting Parts'?`<button class="btn ghost" style="margin-top:.6rem" onclick="setStatus('${id}','Awaiting Parts')">Waiting on parts</button>`:''}
  <div class="lbl" style="margin:1.2rem 0 .3rem">Field notes</div>${j.notes?`<div class="note">${esc(j.notes)}</div>`:'<div class="meta">No notes yet.</div>'}
  <textarea id="nt" class="f" rows="3" placeholder="Add a note…"></textarea>
  <div class="row" style="margin-top:.6rem;gap:.6rem"><button class="btn ghost sm" id="mic" onclick="dictate()">${I('<rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v4"/>')}Dictate</button><button class="btn sm" style="flex:1" onclick="addNote('${id}')">Save note</button></div>`);
}
async function write(job,patch,okMsg){
  /* not awaited: Firestore queues the write offline and syncs when signal returns */
  fb.db.collection(C.jobs).doc(job.docId).update(patch).catch(e=>toast(e.code==='permission-denied'?'No permission for that action':'Sync failed — retrying'));
  toast(navigator.onLine?okMsg:okMsg+' • queued offline');return true
}
async function advance(id){const j=S.jobs.get(id),n=STEPS[STEPS.indexOf(j.status)+1];if(!n)return;await setStatus(id,n)}
async function setStatus(id,st){const j=S.jobs.get(id),p={status:st,updatedAt:FV().serverTimestamp(),statusBy:S.user.name};if(st==='Completed'){p.completedAt=FV().serverTimestamp();S.doneN=(S.doneN||0)+1}
  if(await write(j,p,'Status → '+st)||true){j.status=st;closeSheet();render()}}
async function claim(id){const j=S.jobs.get(id);
  try{await fb.db.runTransaction(async t=>{const r=fb.db.collection(C.jobs).doc(id),s=await t.get(r),d=s.data();if(d.techId||d.assignedTo)throw new Error('taken');t.update(r,{techId:S.user.id,tech:S.user.name,status:'Assigned',claimedAt:FV().serverTimestamp()})});toast('Job claimed');closeSheet()}
  catch(e){toast(e.message==='taken'?'Someone claimed it first':'Could not claim')}}
async function addNote(id){const v=$('nt').value.trim();if(!v)return;const j=S.jobs.get(id),t=new Date().toLocaleString([], {dateStyle:'short',timeStyle:'short'});
  const notes=(j.notes?j.notes+'\n':'')+`[${t} • ${S.user.name}] ${v}`;if(await write(j,{notes},'Note saved')||true){j.notes=notes;openJob(id)}}
function dictate(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return toast('Voice not supported on this browser');
  const r=new R();r.lang=navigator.language||'en-ZA';r.interimResults=false;const b=$('mic');b.style.opacity=.5;
  r.onresult=e=>{$('nt').value=($('nt').value+' '+e.results[0][0].transcript).trim()};r.onend=()=>b.style.opacity=1;r.onerror=()=>toast('Mic unavailable');r.start()}
function navTo(j){if(!j)return toast('No job selected');const ll=siteLL(j);const q=ll?`${ll.lat},${ll.lng}`:encodeURIComponent(j.site||j.loc||'');if(!q)return toast('No location on this job');open('https://www.google.com/maps/dir/?api=1&destination='+q,'_blank')}

/* ---------- faults & backup (creates normal Help Centre jobs) ---------- */
function faultSheet(){sheet(`<h3 style="margin:0 0 .2rem;font-size:19px;font-weight:900">Log a fault</h3><div class="meta">Lands instantly on the Help Centre monitor.</div>
  <input id="fT" class="f" placeholder="What's wrong?"><input id="fS" class="f" placeholder="Site" list="sl" value="${esc((active()[0]||{j:{}}).j.site||'')}"><datalist id="sl">${S.sites.slice(0,400).map(s=>`<option value="${esc(s.name||s.siteName||s.id)}">`).join('')}</datalist>
  <select id="fP" class="f"><option>Medium</option><option>High</option><option>Critical</option><option>Low</option></select>
  <button class="btn" style="margin-top:1rem" onclick="createJob()">Submit fault</button>`)}
async function createJob(extra){
  const t=$('fT')&&$('fT').value.trim();if(!extra&&!t)return toast('Describe the fault');
  const job=extra||{title:t,site:$('fS').value.trim(),priority:$('fP').value,status:'Open',techId:S.user.id,tech:S.user.name};
  Object.assign(job,{source:'staff-app',reportedBy:S.user.name,reportedById:S.user.id});
  {fb.db.collection(C.jobs).add({...job,createdAt:FV().serverTimestamp()}).catch(()=>toast('Could not log fault'));toast(navigator.onLine?'Fault logged':'Fault queued offline')}
  closeSheet();render()}
function backup(){const a=active()[0];if(!a)return toast('No active job to escalate');
  if(!confirm('Request backup for '+a.j.id+'? This alerts management with your live location.'))return;
  createJob({title:'BACKUP REQUESTED • '+a.j.title,site:a.j.site,priority:'Critical',status:'Open',techId:'',tech:'',parentJob:a.j.docId,backupFor:S.user.name,lat:S.here&&S.here.lat,lng:S.here&&S.here.lng})}

/* ---------- RADAR: genset telemetry + site finder ---------- */
function rRadar(){
  const t=S.radarTab;let h=`<div class="seg"><button class="${t==='gens'?'on':''}" onclick="S.radarTab='gens';rRadar()">Genset radar</button><button class="${t==='sites'?'on':''}" onclick="S.radarTab='sites';rRadar()">Site finder</button></div>`;
  if(t==='gens'){
    const g=S.gens.map(x=>({...x,fu:Number(x.fuel??x.fuelLevel??x.fuelPercent),ll:(x.lat&&x.lng&&S.here)?km(S.here,{lat:+x.lat,lng:+x.lng}):null})).sort((a,b)=>(a.fu||999)-(b.fu||999));
    h+=g.length?g.map(x=>{const f=Number.isFinite(x.fu)?x.fu:null,col=f==null?'#94a3b8':f<25?'#ef4444':f<50?'#f59e0b':'#00b36b';
      return`<div class="card"><div class="row sp"><b style="font-size:15px">${esc(x.name||x.site||x.id)}</b><span class="chip ${/run|on/i.test(x.status)?'grn':/fault|off|alarm/i.test(x.status)?'red':''}">${esc(x.status||'Unknown')}</span></div>
      <div class="fuel"><i style="width:${f==null?0:Math.max(3,Math.min(100,f))}%;background:${col}"></i></div>
      <div class="row sp meta"><span>Fuel ${f==null?'—':f+'%'}</span><span>Load ${esc(x.load??'—')}${x.load!=null?'%':''}</span><span>${x.runtime!=null?esc(x.runtime)+' h':''}</span><span>${x.ll!=null?x.ll.toFixed(1)+' km':''}</span></div></div>`}).join(''):'<div class="card empty">No generator telemetry in the database yet.</div>';
  }else{
    h+=`<input class="f" style="margin:0 0 .9rem" placeholder="Search ${S.sites.length||''} sites…" oninput="S.sq=this.value;siteList()" value="${esc(S.sq||'')}"><div id="sl2"></div>`}
  $('t-radar').innerHTML=h;if(t==='sites')siteList();
}
function siteList(){const q=(S.sq||'').toLowerCase(),r=S.sites.filter(s=>!q||(s.name||s.siteName||s.id).toLowerCase().includes(q)).slice(0,40);
  $('sl2').innerHTML=r.map(s=>{const n=s.name||s.siteName||s.id,ll=s.lat&&(s.lng||s.lon)?`${s.lat},${s.lng||s.lon}`:encodeURIComponent(n);return`<div class="card row sp"><div><b>${esc(n)}</b><div class="meta">${esc(s.region||s.county||'')}${s.service?' • '+esc(s.service):''}</div></div><a href="https://www.google.com/maps/search/?api=1&query=${ll}" target="_blank">Map</a></div>`}).join('')||'<div class="card empty">No matching sites.</div>'}

/* ---------- HELP: instant search over knowledge + resources + training ---------- */
function rHelp(){
  const types=[['all','All'],['knowledge','Fixes'],['resources','Docs'],['training','Training']];
  $('t-help').innerHTML=`<input id="kq" class="f" style="margin:0 0 .8rem" placeholder="Search fixes, manuals, training…" value="${esc(S.q)}" oninput="S.q=this.value;kbList()">
  <div class="seg">${types.map(t=>`<button class="${S.kbType===t[0]?'on':''}" onclick="S.kbType='${t[0]}';rHelp()">${t[1]}</button>`).join('')}</div><div id="kl"></div>`;kbList()}
function kbList(){
  const q=S.q.toLowerCase().split(/\s+/).filter(Boolean),tt=x=>x.title||x.name||x.question||x.id,bd=x=>x.body||x.content||x.answer||x.description||x.summary||'';
